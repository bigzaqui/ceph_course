<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceph &amp; CephFS — Motion Canvas MP4 Course (3Blue1Brown Style)</title>
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="studio-shell">
    <header class="studio-topbar">
      <div class="brand-row">
        <span class="mc-badge">Motion Canvas • MP4</span>
        <span class="brand-title">Ceph &amp; CephFS Visualized — 3Blue1Brown Style Video Course</span>
      </div>
      <div class="top-actions">
        <button id="mode-full-btn" class="mode-btn active" title="Play single continuous 7m11s MP4">Full Course MP4 (7m 11s)</button>
        <button id="mode-chapter-btn" class="mode-btn" title="Play individual scene-01.mp4 .. scene-08.mp4 files">Per-Scene MP4s (1–8)</button>
        <button id="toggle-code-btn" class="mode-btn" title="Inspect Motion Canvas generator code">{ } Motion Canvas Code</button>
        <a id="dl-scene-btn" class="dl-btn" href="videos/scene-01.mp4" download>⬇ Scene 1 MP4</a>
        <a class="dl-btn primary" href="videos/ceph-course-full.mp4" download>⬇ Full Course MP4 (30 MB)</a>
      </div>
    </header>

    <aside class="studio-sidebar">
      <div class="sidebar-heading">Course Chapters (8 Scenes • 40 Steps)</div>
      <div id="chapter-list"></div>
    </aside>

    <main class="studio-main">
      <div class="video-stage">
        <video
          id="course-video"
          src="videos/ceph-course-full.mp4"
          controls
          preload="metadata"
          playsinline
        ></video>
      </div>

      <div class="controls-bar">
        <div id="steps-row" class="steps-row"></div>
        <div class="transport-row">
          <div class="transport-left">
            <span id="status-label">Ready: videos/ceph-course-full.mp4 (1280×720 • 30 FPS • ElevenLabs Audio)</span>
          </div>
          <div class="transport-right">
            <span>Speed:</span>
            <button class="mode-btn" data-speed="0.75">0.75×</button>
            <button class="mode-btn active" data-speed="1">1×</button>
            <button class="mode-btn" data-speed="1.25">1.25×</button>
            <button class="mode-btn" data-speed="1.5">1.5×</button>
            <button class="mode-btn" data-speed="2">2×</button>
          </div>
        </div>
      </div>

      <div id="code-drawer" class="code-drawer">
        <pre id="code-content"></pre>
      </div>
    </main>
  </div>

  <script src="course-data.js?v=20"></script>
  <script src="video-player.js?v=20"></script>
</body>
</html>
